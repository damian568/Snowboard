buildscript {
    ext.kotlin_version = "1.4.32"
    ext {
        agp_version = '8.1.0'
        agp_version2 = '8.1.1'
        kotlin_version = '2.1.0'
        nav_version = '2.7.7'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath "com.google.gms:google-services:4.5.0"
    }
}

plugins {
    id 'com.android.application' version '8.1.1' apply false
    id 'com.android.library' version '8.1.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0' apply false
}

// Point git at the shared hooks in <repo>/.githooks (commit message validation, SNOW-69).
// Runs on every Gradle sync/build so fresh clones get the hooks without manual setup.
def gitHooksDir = new File(rootDir.parentFile, '.githooks')
if (gitHooksDir.isDirectory() && System.getenv('CI') == null) {
    try {
        gitHooksDir.listFiles().each { it.setExecutable(true) }
        def current = ['git', 'config', '--get', 'core.hooksPath'].execute(null, rootDir).text.trim()
        if (current != '.githooks') {
            ['git', 'config', 'core.hooksPath', '.githooks'].execute(null, rootDir).waitFor()
            logger.lifecycle('Git hooks installed from .githooks')
        }
    } catch (Exception e) {
        logger.warn("Could not install git hooks: ${e.message}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}